{% extends "layout/base.html" %}
{% block title %}Health Ring — Sign In{% endblock %}
{% block content %}
<div class="auth-shell">
  {% include "partials/brand_panel.html" %}

  <div class="auth-form-panel">
    <div class="auth-card">
      <h2>Welcome </h2>
      <p class="auth-subtitle">Sign in to your Health Ring account</p>

      <div class="alert-banner error-banner" id="loginAlert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span id="loginAlertText"></span>
      </div>

      <div class="role-tabs" id="roleTabs">
    <button type="button" class="role-tab active" data-role="patient">Patient</button>
    <button type="button" class="role-tab" data-role="doctor">Doctor</button>
    <button type="button" class="role-tab" data-role="family">Family</button>
    <button type="button" class="role-tab" data-role="admin">Admin</button>
    <button type="button" class="role-tab" data-role="super_admin">Super Admin</button>
</div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"></path><path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V6z"></path><path d="m22 6-10 7L2 6"></path></svg>
<input
    type="email"
    id="email"
    name="login_email"
    class="form-control has-icon"
    placeholder="you@example.com"
    autocomplete="off"
    spellcheck="false"
    autocapitalize="off"
    required>          </div>
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="password">Password</label>
            <a href="{{ url_for('pages.forgot_password') }}" class="form-link-sm">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="password" class="form-control has-icon has-icon-right" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-visibility" data-target="password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <div class="field-error" id="passwordError"></div>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary" id="loginSubmitBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          <span>Sign in</span>
        </button>
      </form>

      <div class="auth-footer-text">
         <a href="{{ url_for('pages.create_account') }}">Create Account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
