<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background:#f8fafc; font-family:Arial, Helvetica, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc; padding:40px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e2e8f0;">
          <tr>
            <td style="background:linear-gradient(135deg,#0b1330,#14204d); padding:28px 32px;">
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td style="width:40px; height:40px; background:linear-gradient(135deg,#2563eb,#2dd4bf); border-radius:10px; text-align:center; vertical-align:middle; color:#ffffff; font-weight:bold; font-size:18px;">H</td>
                  <td style="padding-left:12px; color:#ffffff; font-size:17px; font-weight:bold;">Health Ring</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px;">
              <h2 style="margin:0 0 12px 0; color:#0f172a; font-size:21px;">{{ heading }}</h2>
              <p style="margin:0 0 24px 0; color:#64748b; font-size:14.5px; line-height:1.6;">
                Hi {{ first_name }}, use the verification code below to continue. This code will expire shortly.
              </p>
              <div style="background:#f8fafc; border:1.5px dashed #cbd5e1; border-radius:10px; padding:20px; text-align:center; margin-bottom:24px;">
                <span style="font-size:32px; font-weight:800; letter-spacing:10px; color:#2563eb;">{{ otp_code }}</span>
              </div>
              <p style="margin:0; color:#94a3b8; font-size:13px; line-height:1.6;">
                If you did not request this code, you can safely ignore this email. Never share this code with anyone.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 32px; background:#f8fafc; text-align:center; color:#94a3b8; font-size:12px;">
              &copy; Health Ring Healthcare Platform
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
