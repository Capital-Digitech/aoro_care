{% extends "layout/base.html" %}

{% block title %}Add Patient{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h4 class="mb-0">
                <i class="fa-solid fa-hospital-user me-2"></i>
                Add New Patient
            </h4>
        </div>

        <div class="card-body">

            <form method="POST" action="{{ url_for('patient.patient_add') }}">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Patient Code</label>
                        <input
                            type="text"
                            class="form-control"
                            name="patient_code"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Assigned Doctor</label>
                        <select
                            class="form-select"
                            name="assigned_doctor_id"
                        >
                            <option value="">Select Doctor</option>

                            {% for doctor in doctors %}
                            <option value="{{ doctor.id }}">
                                Dr. {{ doctor.user.first_name }} {{ doctor.user.last_name }}
                            </option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input
                            type="text"
                            class="form-control"
                            name="first_name"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input
                            type="text"
                            class="form-control"
                            name="last_name"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mobile</label>
                        <input
                            type="text"
                            class="form-control"
                            name="mobile"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Gender</label>
                        <select
                            class="form-select"
                            name="gender"
                        >
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Blood Group</label>
                        <input
                            type="text"
                            class="form-control"
                            name="blood_group"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Height (cm)</label>
                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            name="height"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Weight (kg)</label>
                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            name="weight"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Emergency Contact Name
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            name="emergency_contact_name"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Emergency Contact Phone
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            name="emergency_contact_phone"
                        >
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">Address</label>
                        <textarea
                            class="form-control"
                            rows="2"
                            name="address"
                        ></textarea>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">
                            Medical History
                        </label>
                        <textarea
                            class="form-control"
                            rows="3"
                            name="medical_history"
                        ></textarea>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">
                            Allergies
                        </label>
                        <textarea
                            class="form-control"
                            rows="3"
                            name="allergies"
                        ></textarea>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>
                        <select
                            class="form-select"
                            name="status"
                        >
                            <option value="active" selected>
                                Active
                            </option>
                            <option value="inactive">
                                Inactive
                            </option>
                        </select>
                    </div>

                </div>

                <hr>

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    <i class="fa-solid fa-save me-2"></i>
                    Save Patient
                </button>

                <a
                    href="{{ url_for('patient.patient_list') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
