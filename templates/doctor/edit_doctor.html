{% extends "layout/base.html" %}

{% block title %}Edit Doctor{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4>Edit Doctor</h4>
        </div>

        <div class="card-body">

            <form method="POST"
                  action="{{ url_for('doctor.doctor_edit', id=doctor.id) }}">

                <input type="hidden"
                       name="csrf_token"
                       value="{{ csrf_token() }}">

                <div class="row">

                    <!-- Hospital -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Hospital</label>

                        <select
                            name="hospital_id"
                            class="form-select"
                            required>

                            {% for hospital in hospitals %}

                            <option value="{{ hospital.id }}"
                            {% if doctor.hospital_id == hospital.id %}selected{% endif %}>
                                {{ hospital.hospital_name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- Doctor Code -->

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Doctor Code</label>

                        <input
                            type="text"
                            name="doctor_code"
                            class="form-control"
                            value="{{ doctor.doctor_code }}"
                            required>

                    </div>

                    <!-- First Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">First Name</label>

                        <input
                            type="text"
                            name="first_name"
                            class="form-control"
                            value="{{ doctor.user.first_name }}"
                            required>

                    </div>

                    <!-- Last Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Last Name</label>

                        <input
                            type="text"
                            name="last_name"
                            class="form-control"
                            value="{{ doctor.user.last_name }}"
                            required>

                    </div>

                    <!-- Email -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Email</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ doctor.user.email }}"
                            required>

                    </div>

                    <!-- Mobile -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Mobile</label>

                        <input
                            type="text"
                            name="mobile"
                            class="form-control"
                            value="{{ doctor.user.mobile }}">

                    </div>

                    <!-- Gender -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Gender</label>

                        <select
                            name="gender"
                            class="form-select">

                            <option value="Male"
                            {% if doctor.user.gender=="Male" %}selected{% endif %}>
                                Male
                            </option>

                            <option value="Female"
                            {% if doctor.user.gender=="Female" %}selected{% endif %}>
                                Female
                            </option>

                            <option value="Other"
                            {% if doctor.user.gender=="Other" %}selected{% endif %}>
                                Other
                            </option>

                        </select>

                    </div>

                    <!-- Address -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Address</label>

                        <input
                            type="text"
                            name="address"
                            class="form-control"
                            value="{{ doctor.user.address }}">

                    </div>

                    <!-- Specialization -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Specialization</label>

                        <input
                            type="text"
                            name="specialization"
                            class="form-control"
                            value="{{ doctor.specialization }}">

                    </div>

                    <!-- Qualification -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Qualification</label>

                        <input
                            type="text"
                            name="qualification"
                            class="form-control"
                            value="{{ doctor.qualification }}">

                    </div>

                    <!-- Experience -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Experience</label>

                        <input
                            type="number"
                            name="experience_years"
                            class="form-control"
                            value="{{ doctor.experience_years }}">

                    </div>

                    <!-- Medical License -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Medical License</label>

                        <input
                            type="text"
                            name="medical_license"
                            class="form-control"
                            value="{{ doctor.medical_license }}">

                    </div>

                    <!-- Consultation Fee -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Consultation Fee</label>

                        <input
                            type="number"
                            step="0.01"
                            name="consultation_fee"
                            class="form-control"
                            value="{{ doctor.consultation_fee }}">

                    </div>

                    <!-- Available Days -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Available Days</label>

                        <input
                            type="text"
                            name="available_days"
                            class="form-control"
                            value="{{ doctor.available_days }}">

                    </div>

                    <!-- Available Time -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Available Time</label>

                        <input
                            type="text"
                            name="available_time"
                            class="form-control"
                            value="{{ doctor.available_time }}">

                    </div>

                    <!-- Status -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Status</label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="active"
                            {% if doctor.status=="active" %}selected{% endif %}>
                                Active
                            </option>

                            <option value="inactive"
                            {% if doctor.status=="inactive" %}selected{% endif %}>
                                Inactive
                            </option>

                        </select>

                    </div>

                    <!-- About -->

                    <div class="col-md-12 mb-3">

                        <label class="form-label">About Doctor</label>

                        <textarea
                            name="about"
                            rows="4"
                            class="form-control">{{ doctor.about }}</textarea>

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Update Doctor

                </button>

                <a
                    href="{{ url_for('doctor.doctor_list') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
